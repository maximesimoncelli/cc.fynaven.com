name: Full Check

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24.9.0
      uses: actions/setup-node@v4
      with:
        node-version: 24.9.0
        cache: 'pnpm'
    - run: pnpm ci
    - run: pnpm check
